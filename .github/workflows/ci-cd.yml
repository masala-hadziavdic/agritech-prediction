name: CI-CD Crop Yield Application

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests API et frontend
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            streamlit/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r streamlit/requirements.txt
          pip install pytest httpx

      - name: Verifier la syntaxe Python
        run: |
          python -m compileall -q api streamlit tests

      - name: Executer les tests unitaires et API
        run: |
          python -m pytest tests/ -v

  docker:
    name: Build et publication Docker Hub
    runs-on: ubuntu-latest
    needs: tests

    # Publier uniquement apres un push sur main ou master.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crop-yield-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/crop-yield-api:${{ github.sha }}
