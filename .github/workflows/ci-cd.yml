name: CI-CD Crop Yield Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # JOB 1 : TESTS
  # ============================================================
  tests:
    name: Tests API et frontend
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            streamlit/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r streamlit/requirements.txt
          pip install pytest httpx

      - name: Verifier la syntaxe Python
        run: |
          python -m compileall -q api streamlit tests

      - name: Executer les tests
        run: |
          python -m pytest tests/ -v


  # ============================================================
  # JOB 2 : BUILD + PUSH DOCKER HUB
  # ============================================================
  docker:
    name: Build et publication Docker Hub
    runs-on: ubuntu-latest
    needs: tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Recuperer le code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Vérification des secrets
      # ----------------------------------------------------------
      - name: Verifier les secrets Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || \
            (echo "DOCKERHUB_USERNAME absent ou vide" && exit 1)

          test -n "$DOCKERHUB_TOKEN" || \
            (echo "DOCKERHUB_TOKEN absent ou vide" && exit 1)

          echo "Les secrets Docker Hub sont presents."


      # ----------------------------------------------------------
      # LOGIN DOCKER HUB
      # ----------------------------------------------------------
      - name: Login Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | \
            docker login docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin


      # ----------------------------------------------------------
      # BUILD + PUSH
      # ----------------------------------------------------------
      - name: Construire et publier l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crop-yield-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/crop-yield-api:${{ github.sha }}